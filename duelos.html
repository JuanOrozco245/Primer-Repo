<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duelos — Kimetsu · Jujutsu · Black Clover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* =====================================================
     DUELOS v2 · retratos + poderes seleccionables
     + evolución (despertar) · un duelo por anime
     ===================================================== */

  :root {
    --ink: #efe9e1;
    --ink-soft: rgba(239, 233, 225, 0.62);
    --faint: rgba(239, 233, 225, 0.28);
    --glass: rgba(255, 255, 255, 0.05);
    --stroke: rgba(255, 255, 255, 0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: #0a0c0e;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Aréna ---------- */
  .arena {
    position: relative;
    min-height: 100svh;
    padding: clamp(28px, 6vh, 64px) 20px clamp(34px, 6vh, 70px);
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .arena + .arena { border-top: 1px solid rgba(255, 255, 255, 0.045); }

  .arena.ska { background:
      repeating-conic-gradient(rgba(255,255,255,.018) 0% 25%, transparent 0% 50%) 0 0/34px 34px,
      radial-gradient(80% 55% at 82% -4%, rgba(238,152,186,.09), transparent 62%),
      linear-gradient(168deg, #131e17 0%, #0b1310 52%, #090d10 100%);
  }
  .arena.sjk { background: radial-gradient(110% 75% at 50% 34%,
      #262148 0%, #18142f 46%, #0e0b1c 80%, #0a0813 100%);
  }
  .arena.sbc { background:
      repeating-conic-gradient(from 208deg at 8% -8%, rgba(255,255,255,.02) 0deg 2.3deg, transparent 2.3deg 9deg),
      linear-gradient(168deg, #13221a 0%, #0e1712 55%, #0a0e0b 100%);
  }

  .ringring, .rays { position: absolute; border-radius: 50%; pointer-events: none; }
  .sjk .ringring { left: 50%; top: 30%; width: 92vmin; height: 92vmin;
    border: 1px solid rgba(255,255,255,.05); transform: translate(-50%, -50%); }
  .sjk .ringring.sml { width: 58vmin; height: 58vmin; opacity: .7; }
  .sbc .rays { left: 10%; top: -14%; width: 74vmin; height: 74vmin;
    background: repeating-conic-gradient(rgba(255,255,255,.05) 0deg 1.8deg, transparent 1.8deg 8deg); }

  .petalinas { position: absolute; inset: 0; pointer-events: none; }
  .petalinas span {
    position: absolute; top: -4%;
    width: 12px; height: 12px;
    background: linear-gradient(135deg, #f8cfdb, #e8a2be);
    border-radius: 100% 22% 100% 22%;
    opacity: .8;
    animation: pfall linear infinite;
  }
  @keyframes pfall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(105svh) rotate(330deg); }
  }

  .duelo { position: relative; width: min(960px, 100%); z-index: 5; }

  /* ---------- Encabezado ---------- */
  .epoca {
    display: flex; flex-direction: column; align-items: center;
    gap: 9px; text-align: center;
    margin-bottom: clamp(20px, 4vh, 38px);
  }
  .epoca .kicker {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--faint);
  }
  .epoca h2 {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(32px, 6vw, 58px);
    letter-spacing: -0.02em; line-height: 1.02;
  }
  .epoca .jp {
    font-size: clamp(13px, 2vw, 17px);
    color: var(--ink-soft); letter-spacing: 0.3em;
  }

  /* ---------- Combate ---------- */
  .bandos {
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    gap: clamp(10px, 2.4vw, 22px);
    align-items: start;
  }

  .peleador {
    border: 1px solid var(--stroke);
    border-radius: 20px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: clamp(14px, 2.4vw, 22px);
    text-align: center;
  }

  .avatar {
    position: relative;
    max-width: 220px;
    margin: 0 auto 12px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    background:
      radial-gradient(130% 95% at 50% 8%, rgba(255,255,255,0.10), transparent 62%),
      linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.32));
    animation: flotar 4.6s ease-in-out infinite;
  }
  .avatar svg { display: block; width: 100%; height: auto; }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  /* aura del despertar */
  .avatar::before {
    content: "";
    position: absolute; inset: -12%;
    border-radius: 50%;
    background: radial-gradient(closest-side,
      var(--c) 0%, transparent 72%);
    opacity: 0;
    filter: blur(14px);
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  .avatar::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 16px;
    border: 1px solid transparent;
    transition: border-color 0.9s ease, box-shadow 0.9s ease;
    pointer-events: none;
  }
  .peleador.despierto .avatar::before { opacity: 0.5; animation: auraPulso 2.6s ease-in-out infinite; }
  .peleador.despierto .avatar::after {
    border-color: color-mix(in srgb, var(--c) 65%, transparent);
    box-shadow: 0 0 26px color-mix(in srgb, var(--c) 35%, transparent), inset 0 0 24px rgba(255,255,255,0.05);
  }
  @keyframes auraPulso {
    0%, 100% { transform: scale(1);    opacity: 0.4; }
    50%      { transform: scale(1.06); opacity: 0.62; }
  }

  .nm {
    font-weight: 700;
    font-size: clamp(15px, 2vw, 18px);
    line-height: 1.3;
  }
  .nm .spark { color: #ffd98e; text-shadow: 0 0 12px rgba(255,210,140,.5); }
  .rol {
    margin-top: 4px;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  .barras { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .pista { height: 9px; border-radius: 6px; background: rgba(255,255,255,0.10); overflow: hidden; }
  .pista b {
    display: block; height: 100%; border-radius: 6px;
    width: 100%;
    background: var(--c);
    box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent);
    transition: width 0.5s ease, background 0.5s ease;
  }
  .pista.mini { height: 5px; }
  .pista.mini b { background: rgba(255,255,255,0.55); box-shadow: none; }
  .rotulo {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-soft);
    margin-top: 7px;
  }

  /* ---------- Poderes ---------- */
  .poderes {
    margin-top: 14px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .tec {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%;
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    color: var(--ink);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--stroke);
    border-radius: 11px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, transform 0.15s;
    text-align: left;
  }
  .tec:hover  { background: rgba(255,255,255,0.11); transform: translateY(-1px); }
  .tec:active { transform: translateY(1px); }
  .tec:disabled { opacity: 0.35; cursor: default; transform: none; }
  .tec .tr {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; color: var(--ink-soft);
    white-space: nowrap;
  }
  .tec.final {
    border-color: color-mix(in srgb, #ffd98e 55%, transparent);
    background: linear-gradient(90deg, rgba(255,217,142,0.14), rgba(255,255,255,0.05));
  }
  .tec.final:hover { background: linear-gradient(90deg, rgba(255,217,142,0.22), rgba(255,255,255,0.08)); }
  .tec.despierta {
    border-style: dashed;
    border-color: color-mix(in srgb, var(--c) 70%, transparent);
    display: none;
  }
  .desp-visible .tec.despierta { display: flex; }

  /* ---------- Registro ---------- */
  .registro {
    margin-top: clamp(14px, 2.6vh, 24px);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    background: rgba(8, 10, 13, 0.45);
    padding: 13px 16px;
    min-height: 118px;
    font-family: "JetBrains Mono", "Cascadia Code", monospace;
    font-size: 11.4px; line-height: 1.85;
    color: var(--ink-soft);
    overflow: hidden;
  }
  .ln { animation: sublinea 0.4s ease both; display: block; }
  .ln b { color: var(--ink); font-weight: 600; }
  .ln em { font-style: italic; }
  .ln .dmg { color: #f0b26a; font-weight: 600; }
  .ln .fin { color: #ffd98e; }
  .ln .desp { color: color-mix(in srgb, #c9ffdd 85%, transparent); }
  @keyframes sublinea {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Acciones ---------- */
  .acciones { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .acciones button {
    font-family: inherit;
    font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 100px;
    padding: 11px 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.3s, transform 0.2s;
  }
  .acciones button:hover  { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
  .acciones button:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* ---------- Ganador ---------- */
  .final {
    position: absolute; inset: 0; z-index: 30;
    display: grid; place-items: center;
    background: rgba(6, 8, 10, 0.62);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
  }
  .final.show { opacity: 1; visibility: visible; transition: opacity 0.5s ease; }
  .final > div {
    max-width: 480px;
    border-radius: 20px; padding: 1.5px;
    background: linear-gradient(140deg, rgba(255,231,180,.8), rgba(255,231,180,.1) 55%, rgba(255,231,180,.6));
  }
  .final > div > div {
    border-radius: 19px;
    background: rgba(10, 12, 15, 0.92);
    padding: 30px 26px;
    text-align: center;
  }
  .final h3 {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic; font-weight: 400;
    font-size: clamp(24px, 4.5vw, 34px);
    margin-bottom: 8px;
  }
  .final small {
    font-size: 10.5px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--ink-soft);
    display: block;
  }
  .final .resumen {
    margin-top: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--ink-soft);
  }

  /* sacudida */
  @keyframes temblor {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-6px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, 2px); }
  }
  .sacude { animation: temblor 0.3s ease; }

  /* ---------- Nav lateral ---------- */
  .navpuntos {
    position: fixed; right: 18px; top: 50%;
    transform: translateY(-50%);
    z-index: 50;
    display: flex; flex-direction: column; gap: 12px;
  }
  .navpuntos a {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent;
    transition: background 0.3s;
  }
  .navpuntos a.on { background: rgba(255, 236, 200, 0.9); border-color: transparent; }

  @media (max-width: 760px) {
    .bandos { grid-template-columns: 1fr; }
    .vs { display: none; }
    .bandos > .peleador:first-child { order: 1; }
    .bandos > .peleador:last-child  { order: 2; }
    .registro { min-height: 100px; font-size: 10.4px; }
    .navpuntos { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petalinas { display: none; }
    .sacude { animation: none; }
    .avatar { animation: none; }
    .pista b { transition-duration: 0.15s; }
    .peleador.despierto .avatar::before { animation: none; }
  }
</style>
</head>
<body>

<nav class="navpuntos" aria-label="Duelos">
  <a href="#d-ka" class="on" title="Kimetsu"></a>
  <a href="#d-jk" title="Jujutsu Kaisen"></a>
  <a href="#d-bc" title="Black Clover"></a>
</nav>

<!-- ══════════ DUELO I · KIMETSU ══════════ -->
<section class="arena ska" id="d-ka">
  <div class="petalinas" aria-hidden="true"></div>
  <div class="duelo" id="a-ka"></div>
</section>

<!-- ══════════ DUELO II · JUJUTSU ══════════ -->
<section class="arena sjk" id="d-jk">
  <div class="ringring" aria-hidden="true"></div>
  <div class="ringring sml" aria-hidden="true"></div>
  <div class="duelo" id="a-jk"></div>
</section>

<!-- ══════════ DUELO III · BLACK CLOVER ══════════ -->
<section class="arena sbc" id="d-bc">
  <div class="rays" aria-hidden="true"></div>
  <div class="duelo" id="a-bc"></div>
</section>

<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const azar  = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  /* ================================================================
     RETRATOS SVG · dibujados a mano, uno por peleador
     Vista: busto chibi 100×100. Colores planos, estilo elegante.
     ================================================================ */

  function ojo(x, y, iris, esc = 1) {
    return `
      <g transform="translate(${x},${y}) scale(${esc})">
        <ellipse cx="0" cy="0" rx="6.4" ry="4.6" fill="#faf6f2"/>
        <circle cx="0.4" cy="0.3" r="2.7" fill="${iris}"/>
        <circle cx="1.3" cy="-0.9" r="0.9" fill="#fff"/>
        <path d="M -6.4 -3.6 Q 0 -6.4 6.4 -3.6" stroke="#2a2320" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>`;
  }

  const ART = {
    /* ---------- RENGOKU ---------- */
    rengoku: `
      <svg viewBox="0 0 100 100" aria-label="Rengoku">
        <defs>
          <linearGradient id="gRe" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f9d98c"/>
            <stop offset="0.55" stop-color="#ee7f3c"/>

          </linearGradient>
        </defs>
        <path d="M10,100 Q50,72 90,100 Z" fill="#f2e9dd"/>

        <path d="M24,52 C20,24 36,12 50,12 C64,12 80,24 76,52 C72,40 62,34 50,34 C38,34 28,40 24,52 Z" fill="url(#gRe)"/>
        <path d="M38,15 L41,4 L45,14 Z" fill="#f5b843"/>
        <path d="M47,12 L50,1 L54,12 Z" fill="#f0862f"/>
        <path d="M56,14 L60,5 L63,16 Z" fill="#f5b843"/>
        <ellipse cx="50" cy="52" rx="25" ry="26" fill="#f4d9c4"/>
        <path d="M33,44 q5,-5 13,-3" stroke="#b0472e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M67,44 q-5,-5 -13,-3" stroke="#b0472e" stroke-width="3" fill="none" stroke-linecap="round"/>
        ${ojo(39, 52, "#b0472e")}
        ${ojo(61, 52, "#b0472e")}
        <path d="M50,56 v3.4" stroke="#caa27f" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M43.5,64 q6.5,4.5 13,0" stroke="#8a5a3c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>`,

    /* ---------- AKAZA ---------- */
    akaza: `
      <svg viewBox="0 0 100 100" aria-label="Akaza">
        <path d="M10,100 Q50,74 90,100 Z" fill="#f4dfd6"/>
        <path d="M14,100 Q50,78 86,100" fill="none" stroke="#35528a" stroke-width="3"/>
        <rect x="42" y="67" width="16" height="13" rx="5" fill="#eed3c8"/>
        <ellipse cx="50" cy="53" rx="25" ry="26" fill="#f4dfd6"/>
        <path d="M26,50 C22,26 36,15 50,15 C64,15 78,26 74,50 C70,39 62,36 50,36 C38,36 30,39 26,50 Z" fill="#eba6b8"/>
        <path d="M36,22 L39,12 L42,21 Z" fill="#e18fa6"/>
        <path d="M45,18 L48,9 L51,18 Z" fill="#e18fa6"/>
        <path d="M54,18 L58,10 L61,20 Z" fill="#e18fa6"/>
        <path d="M50,31 v5" stroke="#35528a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M44,33 v4 M56,33 v4" stroke="#35528a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M33,45 q5,-3.5 10,-2" stroke="#26232b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M67,45 q-5,-3.5 -10,-2" stroke="#26232b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        ${ojo(39, 52, "#e8b33a")}
        ${ojo(61, 52, "#e8b33a")}
        <path d="M31,58 q2.5,7 0.5,13 M69,58 q-2.5,7 -0.5,13" stroke="#35528a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M43.5,66 q6.5,4 13,0.5" stroke="#8a5448" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>`,

    /* ---------- GOJO ---------- */
    gojo: `
      <svg viewBox="0 0 100 100" aria-label="Gojo">
        <path d="M10,100 Q50,74 90,100 Z" fill="#14161c"/>
        <path d="M10,100 Q50,74 90,100" fill="none" stroke="#f2f4f8" stroke-width="2.4"/>
        <rect x="42" y="67" width="16" height="13" rx="5" fill="#f4e0d4"/>
        <ellipse cx="50" cy="53" rx="25" ry="26" fill="#f6e6da"/>
        <path d="M25,49 C22,28 35,15 50,15 C65,15 78,28 75,49 C72,40 64,37 50,37 C36,37 28,40 25,49 Z" fill="#f4f6fa"/>
        <path d="M30,36 L34,26 L38,35 Z" fill="#e6eaf0"/>
        <path d="M40,33 L44,23 L48,32 Z" fill="#f4f6fa"/>
        <path d="M52,32 L56,22 L60,31 Z" fill="#e6eaf0"/>
        <path d="M62,34 L66,25 L70,34 Z" fill="#f4f6fa"/>
        <rect x="21" y="45" width="58" height="13" rx="3.4" fill="#17181f"/>
        <path d="M21,50 h58" stroke="#2c2f3a" stroke-width="1.6"/>
        <path d="M38,68 q6,5 12,1" stroke="#8a6a58" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M35,64 q3,3 6,2" stroke="#caa08a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>`,

    /* ---------- SUKUNA ---------- */
    sukuna: `
      <svg viewBox="0 0 100 100" aria-label="Sukuna">
        <path d="M10,100 Q50,74 90,100 Z" fill="#14161c"/>
        <path d="M10,100 Q50,74 90,100" fill="none" stroke="#7a2a2a" stroke-width="2.6"/>
        <rect x="42" y="67" width="16" height="13" rx="5" fill="#f6e2d6"/>
        <ellipse cx="50" cy="53" rx="25" ry="26" fill="#f8e6d8"/>
        <path d="M25,48 C23,28 36,17 50,17 C64,17 77,28 75,48 C70,41 63,38 50,38 C37,38 30,41 25,48 Z" fill="#e8a3a8"/>
        <path d="M28,34 h10 M62,34 h10" stroke="#2a2626" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M48,34 v4 M52,34 v4" stroke="#2a2626" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M31,49 q3,-3 8,-2.4" stroke="#33292b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M69,49 q-3,-3 -8,-2.4" stroke="#33292b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        ${ojo(40, 53, "#d43a3a", 0.92)}
        ${ojo(60, 53, "#d43a3a", 0.92)}
        <path d="M43,44 q2,-2.4 5,-2.2" stroke="#3a2c2c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M57,44 q-2,-2.4 -5,-2.2" stroke="#3a2c2c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M38,63 Q50,73 62,63" stroke="#2a1f22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M44,65 l2,2.6 l2,-2.6 Z" fill="#faf6f2"/>
        <path d="M54,65 l2,2.6 l2,-2.6 Z" fill="#faf6f2"/>
      </svg>`,

    /* ---------- ASTA ---------- */
    asta: `
      <svg viewBox="0 0 100 100" aria-label="Asta">
        <defs>
          <linearGradient id="gAs" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2edda"/>

  /* ================================================================

  /* ================================================================
     Clase Duelo
     ================================================================ */
  class Duelo {
    constructor(cfg) {
      this.cfg = cfg;
      this.sec = document.getElementById("d-" + cfg.id);
      this.raiz = document.getElementById("a-" + cfg.id);
      this.sesion = 0;
      this.ambiente();
      this.pintar();
      this.reset();
    }

    ambiente() {
      if (this.cfg.id === "ka") {
        const cont = this.sec.querySelector(".petalinas");
        for (let i = 0; i < 9; i++) {
          const p = document.createElement("span");
          p.style.left = (Math.random() * 100).toFixed(1) + "%";
          p.style.animationDuration = (14 + Math.random() * 12).toFixed(1) + "s";
          p.style.animationDelay = (-Math.random() * 20).toFixed(1) + "s";
          const s = (9 + Math.random() * 7).toFixed(0);
          p.style.width = s + "px"; p.style.height = s + "px";
          cont.appendChild(p);
        }
      }
    }

    pintar() {
      const c = this.cfg;
      this.raiz.innerHTML = `
        <div class="epoca">
          <span class="kicker">${c.epoca}</span>
          <h2>${c.h2}</h2>
          <span class="jp">${c.jp}</span>
        </div>

        <div class="bandos">
          ${this.tarjeta(c.L, "L")}
          <div class="vs">vs</div>
          ${this.tarjeta(c.R, "R")}
        </div>

        <div class="registro" id="reg-${c.id}"></div>

        <div class="acciones">
          <button data-act="auto">⚔ &nbsp;Combate automático</button>
          <button data-act="reset">↺ &nbsp;Reiniciar</button>
        </div>

        <div class="final" id="fin-${c.id}">
          <div><div>
            <small>resultado del duelo</small>
            <h3 id="h3-${c.id}">—</h3>
            <div class="resumen" id="res-${c.id}"></div>
            <div class="acciones" style="margin-top:16px">
              <button data-act="reset">Revancha</button>
            </div>
          </div></div>
        </div>`;

      this.raiz.querySelector('[data-act="auto"]').addEventListener("click", () => this.combate());
      this.raiz.querySelectorAll('[data-act="reset"]').forEach(
        (b) => b.addEventListener("click", () => this.reset()));
    }

    tarjeta(f, lado) {
      const id = this.cfg.id;
      const tecs = f.tec.map((t, i) => `
        <button class="tec" data-side="${lado}" data-i="${i}" title="${t[3]}">
          <span>${t[0]}</span><span class="tr">${t[1]}–${t[2]}</span>
        </button>`).join("");
      return `
        <div class="peleador" id="p-${id}-${lado}" style="--c:${f.c}">
          <div class="avatar">${f.art}</div>
          <div class="nm" id="nm-${id}-${lado}">${f.n}</div>
          <div class="rol">${f.k} · ${f.rol}</div>
          <div class="barras">
            <div class="pista"><b id="hp-${id}-${lado}"></b></div>
            <div class="pista mini"><b id="ch-${id}-${lado}"></b></div>
            <div class="rotulo">
              <span>Vida <b id="v-${id}-${lado}">100</b></span>
              <span>Carga <b id="cg-${id}-${lado}">0</b>%</span>
            </div>
          </div>
          <div class="poderes">
            ${tecs}
            <button class="tec final" data-side="${lado}" data-fin="1" title="${f.fin[3]}">
              <span>★ ${f.fin[0]}</span><span class="tr">${f.fin[1]}–${f.fin[2]}</span>
            </button>
            <button class="tec despierta" data-side="${lado}" data-desp="1" title="${f.desp[2]}">
              <span>✦ Despertar</span><span class="tr">×${f.desp[1]}</span>
            </button>
          </div>
        </div>`;
    }

    reset() {
      this.sesion++;
      this.auto = false;
      this.terminado = false;
      this.ocupado = false;
      this.rondas = 0;
      this.pico = 0;
      this.L = { hp: 100, ch: 0, mult: 1, chDespierto: false, d: this.cfg.L };
      this.R = { hp: 100, ch: 0, mult: 1, chDespierto: false, d: this.cfg.R };
      document.getElementById("fin-" + this.cfg.id).classList.remove("show");
      this.sec.querySelectorAll(".peleador").forEach((p) => p.classList.remove("despierto"));
      this.sec.querySelectorAll(".bandos").forEach((b) => b.classList.remove("desp-visible"));
      this.pintarBarras();
      document.getElementById("reg-" + this.cfg.id).innerHTML =
        `<span class="ln">${this.cfg.L.n} y ${this.cfg.R.n} se miden en silencio… <b>elige tu técnica</b></span>`;
      this.setControles(true);
    }

    setControles(on) {
      /* el botón de reiniciar (y la revancha) siempre quedan activos */
      this.raiz.querySelector("[data-act='auto']").disabled = !on;
      this.sec.querySelectorAll(".tec").forEach((b) => { b.disabled = !on; });
    }

    pintarBarras() {
      [["L", this.L], ["R", this.R]].forEach(([k, f]) => {
        const hp = document.getElementById(`hp-${this.cfg.id}-${k}`);
        const ch = document.getElementById(`ch-${this.cfg.id}-${k}`);
        const vv = document.getElementById(`v-${this.cfg.id}-${k}`);
        const cg = document.getElementById(`cg-${this.cfg.id}-${k}`);
        if (!hp) return;
        hp.style.width = f.hp + "%";
        hp.style.background = f.hp <= 30 ? "#d9776a" : f.d.c;
        ch.style.width = f.ch + "%";
        vv.textContent = f.hp;
        cg.textContent = f.ch;

        /* el botón de despertar aparece cuando la vida está muy gastada */
        const pod = this.sec.querySelector(`#p-${this.cfg.id}-${k} .poderes`);
        if (pod) pod.classList.toggle("desp-visible", !f.chDespierto && f.hp <= 55);
      });
    }

    log(html) {
      const reg = document.getElementById("reg-" + this.cfg.id);
      const ln = document.createElement("span");
      ln.className = "ln";
      ln.innerHTML = html;
      reg.appendChild(ln);
      while (reg.children.length > 4) reg.removeChild(reg.firstChild);
    }

    /* ejecuta un golpe: eleccion = [nombre, lo, hi, ¿final?] */
    golpe(atz, def, nom, lo, hi, esFinal) {
      const dmg = Math.round(azar(lo, hi) * atz.mult);
      def.hp = Math.max(0, def.hp - dmg);
      atz.ch = Math.min(100, atz.ch + 18);
      def.ch = Math.min(100, def.ch + 12);
      this.rondas++;
      this.pico = Math.max(this.pico, dmg);
      this.pintarBarras();
      return dmg;
    }

    sacudir() {
      this.sec.classList.add("sacude");
      setTimeout(() => this.sec.classList.remove("sacude"), 320);
    }

    despertar(f, lado, objeto) {
      if (objeto.chDespierto) return;
      objeto.chDespierto = true;
      const [nombre, mult, frase] = f.desp;
      objeto.mult = mult;
      this.sec.querySelector(`#p-${this.cfg.id}-${lado}`).classList.add("despierto");
      const nm = document.getElementById(`nm-${this.cfg.id}-${lado}`);
      nm.innerHTML = `${f.n} <span class="spark">✦ ${nombre}</span>`;
      this.log(`<span class="desp"><b>${f.n}</b> despierta: <b>✦ ${nombre}</b> — daño ×${mult}</span>`);
      this.log(`<span class="desp">«${frase}»</span>`);
      this.sacudir();
      this.pintarBarras();
    }

    /* elige acción de la IA para un lado */
    accionIA(f) {
      if (f.ch >= 100) return null;                       // -> final
      return Math.floor(Math.random() * f.d.tec.length);
    }

    /* ================================================================
       MODO MANUAL: clic en cualquier técnica de cualquier lado
       ================================================================ */
    manual(boton) {
      if (this.terminado || this.ocupado || this.auto) return;
      const lado = boton.dataset.side;
      const atz = lado === "L" ? this.L : this.R;
      const def = lado === "L" ? this.R : this.L;
      const ladoDef = lado === "L" ? "R" : "L";

      /* despertar (el propio método guarda contra repeticiones) */
      if (boton.dataset.desp) {
        this.despertar(atz.d, lado, atz);
        return;
      }

      if (atz.hp <= 0 || def.hp <= 0) return;

      let nom, lo, hi, esFinal = false;
      if (boton.dataset.fin) {
        if (atz.ch < 100) { this.log(`La <b>carga</b> de <b>${atz.d.n}</b> aún no llega (100%).`); return; }
        atz.ch = 0;
        [nom, lo, hi] = atz.d.fin;
        esFinal = true;
      } else {
        [nom, lo, hi] = atz.d.tec[+boton.dataset.i];
      }

      const dmg = this.golpe(atz, def, nom, lo, hi, esFinal);
      if (esFinal) {
        this.log(`<span class="fin"><b>${atz.d.n}</b> desata <i>«${nom}»</i> — <span class="dmg">−${dmg}</span> <b>¡TÉCNICA FINAL!</b></span>`);
        this.sacudir();
      } else {
        this.log(`<b>${atz.d.n}</b> usa <i>«${nom}»</i> — <span class="dmg">−${dmg}</span>`);
        if (dmg >= 16) this.sacudir();
      }

      if (def.hp <= 0) { this.fin(atz, def); return; }

      /* el rival responde automáticamente */
      this.ocupado = true;
      this.setControles(false);
      const ses = this.sesion;
      setTimeout(() => {
        if (ses !== this.sesion) return;
        this.ocupado = false;
        this.responder(def, atz, ladoDef, lado);
        this.setControles(true);
      }, 620);
    }

    responder(def, atz, ladoDef, ladoAtz) {
      if (this.terminado) return;
      /* si puede, despierta */
      if (!def.chDespierto && def.hp <= 55) {
        this.despertar(def.d, ladoDef, def);
      }
      let esFinal = false, nom, lo, hi;
      if (def.ch >= 100) {
        def.ch = 0;
        [nom, lo, hi] = def.d.fin;
        esFinal = true;
      } else {
        const t = def.d.tec[Math.floor(Math.random() * def.d.tec.length)];
        [nom, lo, hi] = t;
      }
      const dmg = this.golpe(def, atz, nom, lo, hi, esFinal);
      if (esFinal) {
        this.log(`<span class="fin"><b>${def.d.n}</b> desata <i>«${nom}»</i> — <span class="dmg">−${dmg}</span> <b>¡TÉCNICA FINAL!</b></span>`);
        this.sacudir();
      } else {
        this.log(`<b>${def.d.n}</b> contraataca: <i>«${nom}»</i> — <span class="dmg">−${dmg}</span>`);
        if (dmg >= 16) this.sacudir();
      }
      if (atz.hp <= 0) this.fin(def, atz);
    }

    /* ================================================================
       MODO AUTOMÁTICO
       ================================================================ */
    async combate() {
      if (this.terminado || this.auto) return;
      this.auto = true;
      this.setControles(false);
      const ses = ++this.sesion;

      while (!this.terminado && this.auto && ses === this.sesion) {
        await sleep(760);
        if (ses !== this.sesion) return;
        await this.turnoAuto(ses);
        if (ses !== this.sesion || this.terminado) break;
        await sleep(180);
      }
      if (ses === this.sesion) this.auto = false;
    }

    async turnoAuto(ses) {
      const primero = Math.random() < 0.5 ? [this.L, "L", this.R, "R"] : [this.R, "R", this.L, "L"];
      const [a, aLado, b, bLado] = primero;

      if (!a.chDespierto && a.hp <= 50) this.despertar(a.d, aLado, a);
      if (!b.chDespierto && b.hp <= 50) this.despertar(b.d, bLado, b);

      /* golpe del primero */
      let nom, lo, hi, esFinal = false;
      if (a.ch >= 100) {
        a.ch = 0; [nom, lo, hi] = a.d.fin; esFinal = true;
      } else {
        const t = a.d.tec[Math.floor(Math.random() * a.d.tec.length)];
        [nom, lo, hi] = t;
      }
      const d1 = this.golpe(a, b, nom, lo, hi, esFinal);
      if (esFinal) {
        this.log(`<span class="fin"><b>${a.d.n}</b> desata <i>«${nom}»</i> — <span class="dmg">−${d1}</span> <b>¡TÉCNICA FINAL!</b></span>`);
        this.sacudir();
      } else {
        this.log(`<b>${a.d.n}</b> usa <i>«${nom}»</i> — <span class="dmg">−${d1}</span>`);
      }
      if (b.hp <= 0) { this.fin(a, b); return; }

      await sleep(360);
      if (ses !== this.sesion || this.terminado) return;

      /* golpe del segundo */
      if (b.ch >= 100) {
        b.ch = 0; [nom, lo, hi] = b.d.fin; esFinal = true;
      } else {
        const t = b.d.tec[Math.floor(Math.random() * b.d.tec.length)];
        [nom, lo, hi] = t;
      }
      const d2 = this.golpe(b, a, nom, lo, hi, esFinal);
      if (esFinal) {
        this.log(`<span class="fin"><b>${b.d.n}</b> desata <i>«${nom}»</i> — <span class="dmg">−${d2}</span> <b>¡TÉCNICA FINAL!</b></span>`);
        this.sacudir();
      } else {
        this.log(`<b>${b.d.n}</b> responde con <i>«${nom}»</i> — <span class="dmg">−${d2}</span>`);
      }
      if (a.hp <= 0) this.fin(b, a);
    }

    fin(g, p) {
      this.terminado = true;
      this.auto = false;
      this.setControles(false);
      document.getElementById("h3-" + this.cfg.id).textContent = `¡${g.d.n} se impone!`;
      document.getElementById("res-" + this.cfg.id).innerHTML =
        `${g.d.n} remata con ${g.hp} de vida · ${this.rondas} golpes · golpe máximo: ${this.pico}`;
      document.getElementById("fin-" + this.cfg.id).classList.add("show");
    }
  }

  /* ─── inicialización ─── */
  const DUELOS = CONFIG.map((c) => new Duelo(c));

  /*listeners de técnicas (delegación por sección) */
  document.querySelectorAll(".arena").forEach((sec) => {
    sec.addEventListener("click", (e) => {
      const btn = e.target.closest(".tec");
      if (!btn) return;
      const id = sec.querySelector(".duelo").id.slice(2); /* "d-ka" -> "ka" */
      const duelo = DUELOS.find((d) => d.cfg.id === id);
      duelo.manual(btn);
    });
  });

  /* nav lateral activa */
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach((e) => {
      const l = document.querySelector(`.navpuntos a[href="#${e.target.id}"]`);
      if (l) l.classList.toggle("on", e.isIntersecting);
    });
  }, { threshold: 0.55 });
  document.querySelectorAll(".arena").forEach((s) => obs.observe(s));
</script>
